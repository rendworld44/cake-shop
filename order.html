<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>

        body {
          background: radial-gradient(circle, rgba(174,213,238,1) 0%, rgba(245,245,245,1) 100%);
        }

        #cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 20px auto;
        }

        .custom-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-radius: 12px;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .custom-card img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }

        .info-cake h2 {
            margin: 0;
            font-size: 18px;
        }

        .cake-desciption p {
            margin: 5px 0;
            color: #555;
        }

        .price-container span {
            font-weight: bold;
            font-size: 16px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }

        .qty-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            cursor: pointer;
            transition: 0.2s;
        }

        .qty-btn:hover {
            background-color: #e0e0e0;
        }

        .custom-card input[type="number"] {
            width: 60px;
            text-align: center;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .delete-btn {
            background-color: #ff5f5f;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background-color: #e64545;
        }

        #cart-footer {
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            border-radius: 10px;
        }

        #cart-footer button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        #cart-footer button:hover {
            background-color: #45a049;
        }

        @media (max-width: 600px) {
            .custom-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .custom-card img {
                width: 100%;
                height: auto;
            }
            #cart-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

</head>
<body>
    <div id="cart-items" class="row justify-content-center g-4">

    </div>
    <div id="cart-footer">
    <h3>Total:<span id="total">0</span>SAR</h3>
    <a href="checkout.php"><button onclick="checkout()">Checkout</button></a>
    </div>



<script src="cartest.js"></script>
</body>

</html>
